aid: detectify
name: detectify
description: >-
  Detectify is an External Attack Surface Management (EASM) and Dynamic
  Application Security Testing (DAST) platform that continuously discovers an
  organization's internet-facing assets and runs real, payload-based
  vulnerability tests against them. Its testing engine is fuelled by Crowdsource,
  a network of ~400 vetted ethical hackers who contribute 1,765+ vulnerability
  modules at a ~99.7% true-positive rate. Detectify ships four products — Surface
  Monitoring (attack surface management), Application Scanning (web app DAST),
  API Scanning (OpenAPI-driven API security testing), and Internal Scanning — plus
  a REST API (v3), a remotely-hosted MCP server for AI-driven workflows, and
  integrations for Jira, Slack, Splunk, and CI/CD. Founded in Stockholm and backed
  by Balderton Capital and Insight Partners.
